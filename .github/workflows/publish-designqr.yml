name: Publish DesignQR

on:
  workflow_dispatch:
  push:
    tags:
      - 'designqr-v*'

permissions:
  contents: read

concurrency:
  group: publish-designqr
  cancel-in-progress: false

jobs:
  release:
    name: Verify and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install trusted-publishing npm CLI
        run: npm install --global npm@11.15.0

      - name: Report release toolchain
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Validate release metadata and tag
        run: npm run release:designqr:check

      - name: Verify tag commit is on main
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/designqr-v')
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Run full release gate
        run: npm run check

      - name: Audit npm package contents
        run: npm run audit:designqr-package

      - name: Publish DesignQR to npm
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/designqr-v')
        run: npm publish --workspace designqr --access public

name: Publish Pullground

on:
  workflow_dispatch:
  push:
    tags:
      - 'pullground-v*'

permissions:
  contents: read

concurrency:
  group: publish-pullground
  cancel-in-progress: false

jobs:
  release:
    name: Verify and publish
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install trusted-publishing npm CLI
        run: npm install --global npm@11.15.0

      - name: Install dependencies
        run: npm ci

      - name: Validate release metadata and tag
        run: npm run release:pullground:check

      - name: Verify tag commit is on main
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/pullground-v')
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Run full release gate and retain the tested archive
        run: |
          mkdir -p artifacts/pullground
          set -o pipefail
          npm run check 2>&1 | tee artifacts/pullground/verification.log
        env:
          DESIGNQR_SMOKE_SCENARIOS: 'desktop,small-mobile'

      - name: Read prepared archive metadata
        id: package
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, appendFileSync } from 'node:fs';
          import { checkRelease } from './scripts/check-pullground-release.mjs';
          const release = JSON.parse(readFileSync('artifacts/pullground/release.json', 'utf8'));
          const { manifest, npmTag } = await checkRelease();
          assert.equal(release.name, manifest.name);
          assert.equal(release.version, manifest.version);
          assert.equal(release.filename, `johnson7543-pullground-${manifest.version}.tgz`);
          assert.equal(release.commit, process.env.GITHUB_SHA);
          assert.equal(release.workingTreeDirty, false);
          assert.equal(release.npmTag, npmTag);
          appendFileSync(process.env.GITHUB_OUTPUT, `filename=${release.filename}\ntag=${npmTag}\n`);
          NODE

      - name: Check the same archive with the lowest supported React
        run: |
          set -o pipefail
          npm run check:pullground-package -- --tarball "artifacts/pullground/$PULLGROUND_FILENAME" --react-version 19.0.0 --online 2>&1 | tee artifacts/pullground/react-minimum.log
        env:
          PULLGROUND_FILENAME: ${{ steps.package.outputs.filename }}

      - name: Confirm consumer evidence matches the archive
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const read = file => JSON.parse(readFileSync(file, 'utf8'));
          const release = read('artifacts/pullground/release.json');
          for (const version of new Set(['19.0.0', read('node_modules/react/package.json').version])) {
            const result = read(`artifacts/pullground/consumer-react-${version}.json`);
            assert.equal(result.status, 'passed');
            assert.equal(result.sha256, release.sha256);
            assert.equal(result.filename, release.filename);
            assert.equal(result.version, release.version);
          }
          NODE

      - name: Retain archive, checksums, and validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pullground-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/pullground/
          if-no-files-found: warn
          retention-days: 30

      - name: Publish the tested Pullground archive
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/pullground-v')
        working-directory: artifacts/pullground
        run: |
          sha256sum --check SHA256SUMS
          npm publish "./$PULLGROUND_FILENAME" --access public --tag "$PULLGROUND_TAG"
        env:
          PULLGROUND_FILENAME: ${{ steps.package.outputs.filename }}
          PULLGROUND_TAG: ${{ steps.package.outputs.tag }}
